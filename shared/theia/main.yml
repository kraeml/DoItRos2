    - name: admin
      host: "%"
      password: "{{db_user.password}}"
      priv: "*.*:ALL"

  roles:
    - role: geerlingguy.nginx
      become: yes
      nginx_remove_default_vhost: true
      nginx_vhosts:
        - listen: "80 default_server"
          server_name: "_"
          root: "/var/www/html"
          index: "index.html index.php index.htm index.php index.nginx-debian.html"
          error_log: ""
          state: "present"
          template: "{{ nginx_vhost_template }}"
          filename: "default.conf"
          extra_parameters: |
            location / {
                try_files $uri $uri/ /index.html /index.php;
            }
            location ~ ^/~(?<userdir_user>[\w-]+)(?<userdir_uri>/.*)?$ {
                alias /home/$userdir_user/www$userdir_uri;
            	# autoindex on;
                location ~ [^/]\.php(/|$) {
                    include fastcgi_params;
                    fastcgi_index index.php;
                    # check if requested PHP file really exists
                    if (!-f $request_filename) {
                        return 404;
                    }
                    #NOTE: You should have "cgi.fix_pathinfo = 0;" in php.ini
                    fastcgi_split_path_info ^(.+\.php)(/.+)$;
                    fastcgi_param SCRIPT_FILENAME $request_filename;
                    fastcgi_pass 127.0.0.1:9000;
                }
            }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              #
              # # With php-fpm (or other unix sockets):
              fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
              # # With php-cgi (or other tcp sockets):
              # fastcgi_pass 127.0.0.1:9000;
            }
            # deny access to .htaccess files, if Apache's document root
            # concurs with nginx's one
            location ~ /\.ht {
                deny all;
            }
            location /_OPT {
                try_files $uri @uwsgi;
            }
            location @uwsgi {
                rewrite  ^/_OPT/(.*) /$1 break;
                include uwsgi_params;
                #uwsgi_pass /run/uwsgi/app/OnlinePythonTutor/socket;
                uwsgi_pass localhost:8003;
            }
            ## Begin - Security
            # deny all direct access for these folders
            location ~* /(.git|cache|bin|logs|backups|tests)/.*$ { return 403; }
            # deny running scripts inside core system folders
            location ~* /(system|vendor)/.*\.(txt|xml|md|html|yaml|php|pl|py|cgi|twig|sh|bat)$ { return 403; }
            # deny running scripts inside user folder
            location ~* /user/.*\.(txt|md|yaml|php|pl|py|cgi|twig|sh|bat)$ { return 403; }
            # deny access to specific files in the root folder
            location ~ /(LICENSE.txt|composer.lock|composer.json|nginx.conf|web.config|htaccess.txt|\.htaccess) { return 403; }
    - role: geerlingguy.php
      become: yes
    - role: geerlingguy.composer
      become: yes
    - role: geerlingguy.mysql
      become: yes
      mysql_packages:
        - mariadb-client
        - mariadb-server
        - python3-mysqldb
    #- role: rdf.theia_ide
    #  become: yes

  tasks:
    - name: PHP
      become: yes
      blockinfile:
        path: "/etc/php/{{php_default_version_debian}}/mods-available/xdebug.ini"
        block: |
          echo '[XDebug]
          xdebug.remote_enable = 1
          xdebug.remote_autostart = 1
    - block:
        - name: Install phpmyadmin
          become: yes
          vars:
            version: "{{package_version.phpmyadmin}}"
          unarchive:
            src: https://files.phpmyadmin.net/phpMyAdmin/{{version}}/phpMyAdmin-{{version}}-all-languages.tar.gz
            dest: /var/www/html/
            owner: www-data
            group: www-data
            remote_src: yes

        - name: Link to phpmyadmin
          become: yes
          vars:
             version: "{{package_version.phpmyadmin}}"
          file:
            state: link
            src: /var/www/html/phpMyAdmin-{{version}}-all-languages
            dest: /var/www/html/phpmyadmin

        - name: Copy phpmyadmin config
          become: yes
          template:
            src: config.inc.php.j2
            dest: /var/www/html/phpmyadmin/config.inc.php
            owner: www-data
            group: www-data
            mode: 0664
        - name: Import create_tables.sql similar to mysql -u <username> -p <password> < create_tables.sql
          become: yes
          mysql_db:
            login_user: root
            login_password: root
            state: import
            name: all
            target: /var/www/html/phpmyadmin/sql/create_tables.sql

